<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>刘校售前模拟</title>
  <meta name="description" content="用刘校课程原话接英语学习售前咨询的 AI 对话模拟，每轮显示成本。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%2307C160'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'>刘</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">
        <div class="name">刘校 <span class="badge">AI 模拟</span></div>
        <div class="sub" id="sub">用刘校课程原话接售前咨询</div>
      </div>
      <div class="controls">
        <label class="sel"><span>模型</span><select id="model"></select></label>
        <label class="sel"><span>思考</span>
          <select id="effort">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </label>
        <button class="btn" id="btn-stats" type="button">成本统计</button>
        <button class="btn" id="btn-new" type="button">新会话</button>
        <button class="btn ghost" id="btn-panel" type="button">画像</button>
        <button class="btn ghost" id="btn-settings" type="button" aria-label="设置">设置</button>
      </div>
    </header>

    <div class="main">
      <section class="chat" aria-label="对话">
        <div class="session-bar">
          <span>本会话 <b id="session-cost">$0.0000</b><span class="cny" id="session-cny"></span></span>
          <span class="dot">·</span><span id="session-turns">0 轮</span>
          <span class="dot">·</span><span id="session-model"></span>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div class="chips" id="chips" aria-label="示例问题"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="以客户身份发消息（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send" type="submit">发送</button>
        </form>
      </section>

      <aside class="panel" id="panel" aria-label="分析">
        <button class="panel-close" id="panel-close" type="button" aria-label="关闭">×</button>
        <h3>客户画像</h3>
        <dl class="kv" id="profile"><dt>状态</dt><dd class="muted">还没开始</dd></dl>
        <h3>选中的这一轮</h3>
        <div id="turn-detail" class="muted small">点对话里任意一轮下面的成本行，查看这一轮的阶段、skill、依据和 token 明细。</div>
        <h3>成本怎么算</h3>
        <div id="pricing" class="small"></div>
      </aside>
    </div>
  </div>

  <dialog id="dlg-stats" class="dlg wide">
    <div class="dlg-head">
      <h2>成本统计</h2>
      <button class="icon" data-close type="button" aria-label="关闭">×</button>
    </div>
    <div id="stats-body"></div>
  </dialog>

  <dialog id="dlg-settings" class="dlg">
    <div class="dlg-head">
      <h2>设置</h2>
      <button class="icon" data-close type="button" aria-label="关闭">×</button>
    </div>
    <form id="settings-form" method="dialog" class="form">
      <label id="row-key">OpenRouter key（只存在本浏览器）
        <input id="set-key" type="password" autocomplete="off" placeholder="sk-or-..." />
        <small id="key-hint"></small>
      </label>
      <label id="row-code">访问码
        <input id="set-code" type="password" autocomplete="off" />
      </label>
      <label>汇率（1 美元 ≈ ? 人民币，仅用于显示）
        <input id="set-rate" type="number" step="0.01" min="0" />
      </label>
      <label class="check"><input id="set-delay" type="checkbox" /> 模拟打字：多条回复逐条出现</label>
      <div class="form-actions"><button class="btn primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
